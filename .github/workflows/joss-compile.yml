name: JOSS preprint
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: JOSS preprint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build JOSS preprint
        run: |
          docker run --rm \
            --volume "$PWD:/data" \
            --workdir /data \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            --entrypoint /bin/sh \
            openjournals/inara:latest -ec '
              printf "%s\n" "\renewcommand{\marginpar}[1]{}" \
                "\fancyfoot[L]{}" \
                "\hypersetup{pdfdoi={},pdfvolumenum={},pdfissuenum={}}" \
                > /tmp/joss-preprint-header.tex
              inara -p -o tex,pdf -- paper/paper.md --include-in-header=/tmp/joss-preprint-header.tex
            '
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/paper.pdf
            paper/paper.tex
