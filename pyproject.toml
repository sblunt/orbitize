[build-system]
requires = [
    "setuptools", 
    "numpy",
    "cython", 
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "orbitize"
dynamic = ["version"]
dependencies = [
    "numpy",
    "astropy>=4",
    "scipy",
    "emcee>=3",
    "ptemcee_for_orbitize",
    "matplotlib",
    "corner",
    "h5py",
    "deprecation",
    "pytest",
    "pandas",
    "pyerfa",
    "astroquery",
    "rebound",
    "dynesty",
    "pymultinest",
    "tk",
    "pytest-randomly",
]

[tool.setuptools.dynamic]
version = {attr = "orbitize.__version__"}

[tool.setuptools.packages]
find = {}

[tool.pytest]
addopts = ["--randomly-seed=6674", "--randomly-dont-reorganize"]